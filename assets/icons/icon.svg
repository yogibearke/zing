<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="noteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background with rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="6" />

  <!-- Dynamic Sound Waves (Singing resonance) -->
  <path d="M 96 256 C 96 160, 160 96, 256 96" fill="none" stroke="url(#noteGrad)" stroke-width="12" stroke-linecap="round" opacity="0.3" />
  <path d="M 416 256 C 416 160, 352 96, 256 96" fill="none" stroke="url(#noteGrad)" stroke-width="12" stroke-linecap="round" opacity="0.3" />

  <path d="M 128 256 C 128 185, 185 128, 256 128" fill="none" stroke="url(#noteGrad)" stroke-width="16" stroke-linecap="round" opacity="0.6" />
  <path d="M 384 256 C 384 185, 327 128, 256 128" fill="none" stroke="url(#noteGrad)" stroke-width="16" stroke-linecap="round" opacity="0.6" />

  <!-- Singing Microphone / Musical Note Fusion -->
  <g filter="url(#glow)">
    <!-- Eighth notes stem & beam -->
    <path d="M 230 180 L 330 150 L 330 290" fill="none" stroke="url(#noteGrad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 230 180 L 230 320" fill="none" stroke="url(#noteGrad)" stroke-width="24" stroke-linecap="round" />
    
    <!-- Note heads -->
    <ellipse cx="195" cy="320" rx="42" ry="32" transform="rotate(-20 195 320)" fill="url(#goldGrad)" />
    <ellipse cx="295" cy="290" rx="42" ry="32" transform="rotate(-20 295 290)" fill="url(#goldGrad)" />

    <!-- Sparkle / Pitch Star -->
    <polygon points="370,120 376,134 390,140 376,146 370,160 364,146 350,140 364,134" fill="#38bdf8" />
  </g>
</svg>
